name: Deploy Site

# Push-only, mirroring ci.yml: every branch push builds and verifies the site,
# then publishes it. `master` lands on production (the project's configured
# production branch); every other branch gets its own Cloudflare preview URL,
# which is the whole point of hosting here rather than on GitHub Pages.
on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: deploy-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    # The `secrets` context cannot be read from a step-level `if`, so surface
    # credential presence as a job-level value the conditions below can test.
    # This also covers forks, which never receive the secrets: they still build
    # and verify the site, and skip only the publish step.
    env:
      HAS_CLOUDFLARE_CREDENTIALS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        run: bun run site:build

      - name: Verify built site
        run: bun run site:check

      - name: Deploy to Cloudflare Pages
        if: env.HAS_CLOUDFLARE_CREDENTIALS == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bunx wrangler@4 pages deploy site/dist \
            --project-name roll-parser \
            --branch "${GITHUB_REF_NAME}" | tee deploy.log

          {
            echo "### Site deployed"
            echo
            grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | sort -u | sed 's/^/- /'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Report skipped deploy
        if: env.HAS_CLOUDFLARE_CREDENTIALS != 'true'
        run: |
          {
            echo "### Site built but not deployed"
            echo
            echo 'Set the `CLOUDFLARE_API_TOKEN` and `CLOUDFLARE_ACCOUNT_ID`'
            echo 'repository secrets to enable publishing.'
          } >> "${GITHUB_STEP_SUMMARY}"
