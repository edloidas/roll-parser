name: Deploy Site

# Mirroring ci.yml: every branch push builds and verifies the site, but only
# `master` publishes, through the `cloudflare-production` environment that holds
# the Cloudflare credentials. Branch previews were dropped deliberately — a
# push-event workflow executes the workflow file from the pushed ref, so any
# branch that could reach the credentials could deploy anywhere. Use
# `bun site:preview` locally instead.
#
# The pull_request trigger exists for fork PRs, whose pushes never reach this
# repository, so `site:build` — the only place TypeDoc runs — is otherwise not a
# check they can fail.
#
# ! A fork PR runs this file from its own merge ref, so it can rewrite every
# ! guard below. What keeps that harmless is that fork pull_request runs get no
# ! secrets and a read-only token, leaving `cloudflare-production` unreachable.
# ! pull_request_target grants both and must not be used here.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [master, '[0-9]+.[0-9]+']
  workflow_dispatch:

# PR events key on the PR number — `head_ref` is the bare fork branch name,
# so same-named branches from different forks would cancel each other's runs.
concurrency:
  group: deploy-site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Same-repo PR events are skipped, mirroring ci.yml's `check` gate: the push
  # already built that head commit. `deploy` is unaffected — no PR event can
  # satisfy its `refs/heads/master` guard.
  build:
    name: Build Site
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        run: bun run site:build

      - name: Verify built site
        run: bun run site:check

      - name: Upload built site
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-dist
          path: site/dist/
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    if: github.ref == 'refs/heads/master' && github.repository == 'edloidas/roll-parser'
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-production
      url: https://roll-parser.edloidas.io/
    # The `secrets` context cannot be read from a step-level `if`, so surface
    # credential presence as a job-level value the guard below can test. This
    # job only runs on upstream master, where the environment is expected to
    # hold the credentials — their absence is a misconfiguration, not a skip.
    env:
      HAS_CLOUDFLARE_CREDENTIALS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Require Cloudflare credentials
        if: env.HAS_CLOUDFLARE_CREDENTIALS != 'true'
        run: |
          echo '::error::Missing CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID in the cloudflare-production environment — the site was built but cannot be published.'
          exit 1

      # Checkout only for the commit-message metadata wrangler attaches to the
      # deployment; the deployed files come from the build artifact.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Download built site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-dist
          path: site/dist/

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Log outside the workspace so it cannot dirty the tree wrangler
          # inspects for the deployment's commit metadata.
          log="${RUNNER_TEMP}/deploy.log"

          # ! Exact pin, not `wrangler@4`: a floating major would resolve to
          # ! whatever the registry serves at deploy time, during the one step
          # ! that holds the Cloudflare credentials. Published versions are
          # ! immutable; bump this deliberately.
          bunx wrangler@4.116.0 pages deploy site/dist \
            --project-name roll-parser \
            --branch "${GITHUB_REF_NAME}" \
            --commit-hash "${GITHUB_SHA}" \
            --commit-message "$(git log -1 --pretty=%s)" | tee "${log}"

          {
            echo "### Site deployed"
            echo
            grep -oE 'https://[a-z0-9.-]+\.pages\.dev' "${log}" | sort -u | sed 's/^/- /'
          } >> "${GITHUB_STEP_SUMMARY}"
