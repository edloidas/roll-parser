name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release
  # ! Never cancel a release mid-flight. Publishing to npm is irreversible, and
  #   a second tag arriving between `npm publish` and the GitHub Release step
  #   would leave a published version with no release notes. Releases still
  #   serialize on the shared group; they just queue instead of pre-empting.
  cancel-in-progress: false

# Read-only by default; each job widens only what it needs. `id-token: write`
# lives on `publish` (npm Trusted Publishing) and `contents: write` on
# `release` (creating the GitHub Release), so neither holds the other's rights.
permissions:
  contents: read

jobs:
  precheck:
    name: Verify tag is on master
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.contains.outputs.allowed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check if tag commit is on master or a version branch
        id: contains
        shell: bash
        run: |
          git fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*' || true
          contains="$(git branch -r --contains "${GITHUB_SHA}" | sed 's/^[ *]*//')"
          echo "Branches containing the tag commit:"
          echo "${contains}"
          if echo "${contains}" | grep -Eq '^origin/(master|[0-9]+\.[0-9]+)$'; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish to npm
    needs: precheck
    if: needs.precheck.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      prerelease: ${{ steps.disttag.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Setup Node.js (for npm CLI + OIDC .npmrc wiring)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # ! No package-lock.json in this repo — setup-node's npm auto-cache
          # ! (on by default since v5) hard-fails when it cannot find one. The
          # ! Bun cache below is what actually speeds this job up.
          package-manager-cache: false

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: bun run check:version "${GITHUB_REF_NAME}"

      - name: Verify CHANGELOG has entry for this version
        run: bun run check:changelog "${GITHUB_REF_NAME#v}"

      - name: Determine dist-tag
        id: disttag
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          case "$V" in
            *-alpha*) TAG=alpha ;;
            *-beta*)  TAG=beta ;;
            *-rc*)    TAG=rc ;;
            *-*)      TAG=next ;;
            *)        TAG=latest ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "$TAG" = "latest" ]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Dist-tag: $TAG"

      # The full `release:dry` gate (check, build, check:package, tests) runs
      # here through the `prepublishOnly` hook, which npm fires before packing.
      # There is deliberately no separate step for it: one invocation covers CI
      # and manual publishes alike, and two would double an eight-minute gate.
      #
      # Uses npm CLI (not bun) because Bun does not yet support OIDC Trusted
      # Publishing (oven-sh/bun#15601). Provenance attestations are generated
      # automatically by npm under Trusted Publishing — the `id-token: write`
      # permission above is what enables them, so no `--provenance` flag.
      - name: Build, validate, and publish to npm
        run: npm publish --tag "${{ steps.disttag.outputs.tag }}"

  release:
    name: Create GitHub Release
    needs: [precheck, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # No `bun install`: `check-changelog.ts` only reads CHANGELOG.md and
      # package.json, so the release body needs no dependency tree.
      - name: Extract CHANGELOG section for release body
        shell: bash
        run: |
          bun run check:changelog "${GITHUB_REF_NAME#v}" --extract > release-body.md
          echo "::group::Release body"
          cat release-body.md
          echo "::endgroup::"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ needs.publish.outputs.prerelease == 'true' }}
          body_path: release-body.md
