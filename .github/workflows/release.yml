name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release
  # ! Never cancel a release mid-flight. Publishing to npm is irreversible, and
  #   a second tag arriving between `npm publish` and the GitHub Release step
  #   would leave a published version with no release notes. Releases still
  #   serialize on the shared group; they just queue instead of pre-empting.
  cancel-in-progress: false

# Read-only by default; each job widens only what it needs. `id-token: write`
# lives on `publish` (npm Trusted Publishing) and `contents: write` on
# `release` (creating the GitHub Release), so neither holds the other's rights.
permissions:
  contents: read

jobs:
  # ! Fails the whole workflow on an ineligible tag — a red run, not a silent
  # ! green skip. Every downstream job `needs` this one.
  precheck:
    name: Verify tag is on master
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # All branch refs, so `--contains` sees every branch.
          fetch-depth: 0
          persist-credentials: false

      - name: Fail unless tag commit is on master or a version branch
        shell: bash
        run: |
          contains="$(git branch -r --contains "${GITHUB_SHA}" | sed 's/^[ *]*//')"
          if [ -z "${contains}" ]; then
            echo "::error::Could not resolve any branch containing ${GITHUB_SHA} — refusing to release."
            exit 1
          fi
          echo "Branches containing the tag commit:"
          echo "${contains}"
          if ! echo "${contains}" | grep -Eq '^origin/(master|[0-9]+\.[0-9]+)$'; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at a commit that is not on master or a version branch — refusing to release."
            exit 1
          fi

  # Runs the entire toolchain — compiler, linter, tests, size checks — but
  # holds nothing beyond a read token. Its single product is the tarball the
  # `publish` job uploads verbatim, so no dev dependency ever executes while
  # the npm publishing identity is available.
  validate:
    name: Validate & Pack
    needs: precheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.disttag.outputs.tag }}
      prerelease: ${{ steps.disttag.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: bun run check:version "${GITHUB_REF_NAME}"

      - name: Verify CHANGELOG has entry for this version
        run: bun run check:changelog "${GITHUB_REF_NAME#v}"

      - name: Determine dist-tag
        id: disttag
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          case "$V" in
            *-alpha*) TAG=alpha ;;
            *-beta*)  TAG=beta ;;
            *-rc*)    TAG=rc ;;
            *-*)      TAG=next ;;
            *)        TAG=latest ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "$TAG" = "latest" ]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Dist-tag: $TAG"

      # The same gate `prepublishOnly` runs on a manual publish: check, build,
      # package checks, size budgets, site build and check (TypeDoc), coverage,
      # audit.
      - name: Run release gate
        run: bun run release:dry

      # Pin the npm that packs the tarball — without this, `npm pack` runs on
      # whatever npm the ubuntu-latest image ships that week.
      - name: Setup Node.js (pinned npm for packing)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          # ! No package-lock.json in this repo — setup-node's npm auto-cache
          # ! (on by default since v5) hard-fails when it cannot find one.
          package-manager-cache: false

      # `--ignore-scripts` so packing stays inert; `release:dry` above already
      # ran everything a lifecycle hook would have.
      - name: Pack tarball
        run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"

      - name: Upload tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/roll-parser-*.tgz
          retention-days: 1
          if-no-files-found: error

  # Exercises the exact artifact `publish` uploads. ci.yml smokes a freshly
  # packed dist/, but `test:ci` inside `release:dry` rebuilds dist/ along the
  # way — so without this job, the bytes that ship are never installed or
  # executed anywhere. Installs the uploaded tarball in a scratch project and
  # runs the ESM, require(esm), CLI, and browser checks against it. Holds no
  # credentials, so a full dev-dependency install (for the pinned esbuild) is
  # safe here.
  smoke:
    name: Smoke Exact Tarball
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Exact `engines` floor — the require(esm) claim must hold here.
          node-version: '22.12.0'
          # ! No package-lock.json in this repo — setup-node's npm auto-cache
          # ! (on by default since v5) hard-fails when it cannot find one.
          package-manager-cache: false

      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarball
          path: ${{ runner.temp }}

      - name: Install tarball in scratch project
        run: |
          mkdir "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/roll-parser-*.tgz

      - name: Test ESM import and testing subpath
        working-directory: ${{ runner.temp }}/smoke
        run: |
          node --input-type=module -e "import { roll, VERSION } from 'roll-parser'; import { createMockRng, MockRNGExhaustedError } from 'roll-parser/testing'; const r = roll('4d6kh3', { rng: createMockRng([3, 6, 2, 5]) }); if (r.total !== 14) throw new Error('pinned total ' + r.total); if (typeof MockRNGExhaustedError !== 'function') throw new Error('missing error export'); console.log('ESM OK:', VERSION, r.total)"

      - name: Test require(esm) import
        # ESM-only package — require() works on Node >=22.12 via require(esm).
        working-directory: ${{ runner.temp }}/smoke
        run: |
          node -e "const { roll } = require('roll-parser'); const { createMockRng } = require('roll-parser/testing'); const r = roll('2d6', { rng: createMockRng([3, 4]) }); if (r.total !== 7) throw new Error('pinned total ' + r.total); console.log('require(esm) OK:', r.total)"

      - name: Test installed bin
        working-directory: ${{ runner.temp }}/smoke
        run: ./node_modules/.bin/roll-parser 4d6kh3 --verbose --seed test

      - name: Write browser fixture importing both entry points
        working-directory: ${{ runner.temp }}/smoke
        run: |
          printf '%s\n' \
            "import { roll, SeededRNG, VERSION } from 'roll-parser';" \
            "import { createMockRng } from 'roll-parser/testing';" \
            "const pinned = roll('4d6kh3', { rng: createMockRng([3, 6, 2, 5]) });" \
            "if (pinned.total !== 14) throw new Error('pinned total ' + pinned.total);" \
            "const seeded = roll('2d6', { rng: new SeededRNG('release') });" \
            "console.log('browser-smoke OK', VERSION, pinned.total, seeded.total);" \
            > fixture.mjs

      - name: Bundle fixture for the browser
        # Repo esbuild (lockfile-pinned), resolving against the installed
        # tarball — `--platform=browser` hard-errors on any Node builtin.
        run: ./node_modules/.bin/esbuild "$RUNNER_TEMP/smoke/fixture.mjs" --bundle --platform=browser --format=esm --minify --outfile="$RUNNER_TEMP/smoke/bundle.js"

      - name: Assert bundle is free of Node globals
        run: |
          test -f "$RUNNER_TEMP/smoke/bundle.js"
          if grep -qE "node:|process\.|createRequire" "$RUNNER_TEMP/smoke/bundle.js"; then
            echo 'Browser bundle references Node runtime internals.'
            exit 1
          fi

      - name: Execute browser bundle
        run: node "$RUNNER_TEMP/smoke/bundle.js"

      # The Node-22.12 steps above are done proving the engines floor; the
      # browser leg needs lts/* so `node run.ts` gets native type stripping.
      - name: Setup Node.js (lts for the browser harness)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          # ! No package-lock.json in this repo — setup-node's npm auto-cache
          # ! (on by default since v5) hard-fails when it cannot find one.
          package-manager-cache: false

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./scripts/browser-smoke/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium
        run: ./scripts/browser-smoke/node_modules/.bin/playwright install --with-deps chromium

      - name: Execute bundle in headless Chromium
        run: node scripts/browser-smoke/run.ts "$RUNNER_TEMP/smoke/bundle.js"

      # Both host legs below mirror the `deno-smoke` and `workers-smoke` jobs in
      # ci.yml; the difference is the artifact — here it is the exact tarball
      # about to be published.
      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Write Deno fixture importing both entry points
        working-directory: ${{ runner.temp }}/smoke
        run: |
          printf '%s\n' \
            "import { roll, SeededRNG, VERSION } from 'roll-parser';" \
            "import { createMockRng } from 'roll-parser/testing';" \
            "const pinned = roll('4d6kh3', { rng: createMockRng([3, 6, 2, 5]) });" \
            "if (pinned.total !== 14) throw new Error('pinned total ' + pinned.total);" \
            "const seeded = roll('2d6', { rng: new SeededRNG('release') });" \
            "if (!Number.isInteger(seeded.total) || seeded.total < 2 || seeded.total > 12) throw new Error('seeded total ' + seeded.total);" \
            "if (typeof VERSION !== 'string' || VERSION.length === 0) throw new Error('missing VERSION');" \
            "console.log('deno-smoke OK', VERSION, pinned.total, seeded.total);" \
            > deno-fixture.mjs

      - name: Execute fixture in Deno
        working-directory: ${{ runner.temp }}/smoke
        run: deno run --node-modules-dir=manual deno-fixture.mjs

      - name: Install Worker fixture against the tarball
        run: |
          cp -R scripts/worker-smoke "$RUNNER_TEMP/worker-smoke"
          cd "$RUNNER_TEMP/worker-smoke"
          npm install --no-audit --no-fund "$RUNNER_TEMP"/roll-parser-*.tgz

      - name: Execute Worker in workerd
        timeout-minutes: 5
        run: node "$RUNNER_TEMP/worker-smoke/run.ts"

  # Deliberately minimal: no checkout, no dependency install, no cache — the
  # only thing that runs next to the OIDC publishing identity is npm itself,
  # publishing the exact tarball `validate` produced and `smoke` verified.
  publish:
    name: Publish to npm
    needs: [precheck, validate, smoke]
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Setup Node.js (for npm CLI + OIDC .npmrc wiring)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # ! No package-lock.json in this repo — setup-node's npm auto-cache
          # ! (on by default since v5) hard-fails when it cannot find one.
          package-manager-cache: false

      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarball

      # Uses npm CLI (not bun) because Bun does not yet support OIDC Trusted
      # Publishing (oven-sh/bun#15601). Provenance attestations are generated
      # automatically by npm under Trusted Publishing — the `id-token: write`
      # permission above is what enables them, so no `--provenance` flag.
      # Tarball publishes never run lifecycle scripts; `--ignore-scripts`
      # pins that down explicitly.
      - name: Publish tarball to npm
        run: npm publish roll-parser-*.tgz --ignore-scripts --tag "${{ needs.validate.outputs.tag }}"

  release:
    name: Create GitHub Release
    needs: [precheck, validate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # No `bun install`: `check-changelog.ts` only reads CHANGELOG.md and
      # package.json, so the release body needs no dependency tree.
      - name: Extract CHANGELOG section for release body
        shell: bash
        run: |
          bun run check:changelog "${GITHUB_REF_NAME#v}" --extract > release-body.md
          echo "::group::Release body"
          cat release-body.md
          echo "::endgroup::"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          body_path: release-body.md
