name: CI

# Every branch push runs CI, and GitHub surfaces those runs on the PR for the
# same SHA. The pull_request trigger exists for fork PRs, whose pushes never
# reach this repository — the `check` gate below skips same-repo PR events so
# each SHA still runs exactly once.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [master, '[0-9]+.[0-9]+']
  # Exists for the `bench` job, which is the only job a push cannot reach on a
  # feature branch. Dispatch is not restricted to master on purpose — that is
  # how a branch gets bench numbers now.
  workflow_dispatch:

# PR events key on the PR number — `head_ref` is the bare fork branch name,
# so same-named branches from different forks would cancel each other's runs.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every other job needs `check` (directly or transitively), so this gate
  # cascades: a skipped `check` skips the whole run for same-repo PR events.
  check:
    name: Lint & Type Check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun typecheck

      - name: Lint and format check
        run: bunx biome check .

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Validate package types and exports
        run: bun run check:package

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 1

      # Mirrors release.yml: pinned npm, `--ignore-scripts`, packed once on
      # Linux. Every smoke job consumes this artifact, so all of them test the
      # same bytes — and the same way the published tarball is produced.
      - name: Setup Node.js (pinned npm for packing)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          # ! No package-lock.json in this repo — setup-node's npm auto-cache
          # ! (on by default since v5) hard-fails when it cannot find one.
          package-manager-cache: false

      - name: Pack tarball
        run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"

      - name: Upload tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/roll-parser-*.tgz
          retention-days: 1
          if-no-files-found: error

  size:
    name: Size Limit
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check bundle size and tree-shaking budgets
        run: bun run check:size

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ! Not a pure test step: `src/cli/package-smoke.test.ts` runs `bun run
      # ! build` in `beforeAll`, so this job builds the package itself. That is
      # ! why it needs only `check` — it deliberately does not consume the
      # ! `build` job's artifact, keeping the two paths independent.
      - name: Run tests with coverage gate
        run: bun test:ci

  # Non-blocking trend signal, deliberately outside every required path: wall
  # clock on a shared runner is far too noisy to gate on (cross-process p50
  # variance is ±5-10%, avg ±43%). `fail-on-alert: false` keeps it advisory —
  # and advisory as it is, it is the only signal that tracks runtime cost at
  # all. `check:size` is the one hard budget gate; the draw-count assertions in
  # `src/evaluator/draws.test.ts` gate RNG consumption, not performance.
  # Unprivileged on purpose: this job executes branch-controlled code and
  # dependencies, so the gh-pages write lives in `bench-trend` below, which
  # only ever runs on the default branch.
  # Restricted to default-branch pushes and manual dispatches: the suite costs
  # ~150s against ~80s for every blocking job combined, and anywhere else its
  # artifact expires unread — `bench-trend` is the only consumer. `needs: check`
  # stays; it keeps a commit that fails lint from spending those 150s.
  bench:
    name: Benchmarks (non-blocking)
    runs-on: ubuntu-latest
    needs: check
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run benchmark suite
        run: bun run bench:json

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-results
          path: .tmp/bench-results.json
          retention-days: 7

  # Default-branch pushes own the gh-pages history, so only they store and
  # compare. Alerts are p50-vs-p50 at 1.75x — anything tighter flakes. This is
  # the only job in the workflow holding a write token, and it runs no project
  # code — it consumes the artifact the unprivileged `bench` job produced.
  bench-trend:
    name: Benchmark Trend
    runs-on: ubuntu-latest
    needs: bench
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    continue-on-error: true
    permissions:
      contents: write
    steps:
      # Credentials stay persisted here — the action pushes to gh-pages.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download benchmark results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bench-results
          path: .tmp/

      - name: Publish benchmark trend
        # The upstream `v1` ref is a branch, not a tag; this SHA is its current
        # head and is also exactly what `v1.22.1` points at.
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: roll-parser
          tool: 'customSmallerIsBetter'
          output-file-path: .tmp/bench-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          alert-threshold: '175%'
          comment-on-alert: true
          fail-on-alert: false
          auto-push: true

  # Needs only the dist artifact and Node — the built CLI has zero runtime
  # dependencies, so there is no Bun setup or install here on purpose.
  cli:
    name: CLI Smoke Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # Run under Node, matching the bin shebang — the artifact download drops
      # file modes, so the entry is invoked explicitly rather than executed.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Test CLI help
        run: node dist/cli/index.js --help

      - name: Test CLI version
        run: node dist/cli/index.js --version

      - name: Test CLI roll
        run: node dist/cli/index.js 2d6

      - name: Test CLI verbose
        run: node dist/cli/index.js 4d6kh3 --verbose --seed test

  # Tests the packed tarball, not the working tree: `files` + `exports` + bin
  # wiring + real Node resolution, across the supported Node range. Consumes the
  # tarball `build` packed, so the Windows leg tests the Linux-packed bytes that
  # actually ship — and needs neither a checkout nor the `dist` artifact.
  node-smoke:
    name: Node.js Smoke Test (${{ matrix.node-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # Exact `engines` floor first — the require(esm) claim must hold there.
        # 24.x is listed explicitly so it keeps coverage after `lts/*` moves on.
        node-version: ['22.12.0', '22.x', '24.x', 'lts/*']
        os: [ubuntu-latest]
        # One Windows leg for the CLI — bin shims, path separators, and line
        # endings are where a Unix-developed CLI actually breaks.
        include:
          - node-version: 'lts/*'
            os: windows-latest
    defaults:
      run:
        # Keeps the $RUNNER_TEMP interpolation and the bin invocation identical
        # across both platforms (Git Bash on the Windows runner).
        shell: bash
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/tarball

      - name: Install tarball in scratch project
        run: |
          mkdir "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/tarball/roll-parser-*.tgz

      - name: Test ESM import and testing subpath
        working-directory: ${{ runner.temp }}/smoke
        run: |
          node --input-type=module -e "import { roll, VERSION } from 'roll-parser'; import { createMockRng, MockRNGExhaustedError } from 'roll-parser/testing'; const r = roll('4d6kh3', { rng: createMockRng([3, 6, 2, 5]) }); if (r.total !== 14) throw new Error('pinned total ' + r.total); if (typeof MockRNGExhaustedError !== 'function') throw new Error('missing error export'); console.log('ESM OK:', VERSION, r.total)"

      - name: Test require(esm) import
        # ESM-only package — require() works on Node >=22.12 via require(esm).
        working-directory: ${{ runner.temp }}/smoke
        run: |
          node -e "const { roll } = require('roll-parser'); const { createMockRng } = require('roll-parser/testing'); const r = roll('2d6', { rng: createMockRng([3, 4]) }); if (r.total !== 7) throw new Error('pinned total ' + r.total); console.log('require(esm) OK:', r.total)"

      - name: Test installed bin
        working-directory: ${{ runner.temp }}/smoke
        run: ./node_modules/.bin/roll-parser 4d6kh3 --verbose --seed test

  # Stable fan-in for branch protection. The matrix legs bake their values into
  # the check name, so any matrix change orphans required checks configured
  # against the old names and the PR waits forever on checks that will never
  # report. Protection should require this one name instead of the legs.
  node-smoke-gate:
    name: Node.js Smoke Test
    runs-on: ubuntu-latest
    needs: node-smoke
    # `always()` because a plain `needs` would leave this job skipped when a
    # leg fails, and branch protection treats skipped as passing. A `skipped`
    # result still passes here on purpose: it only occurs when the `check`
    # gate cascade-skips same-repo PR events (the push run carries the real
    # verdict) or when an upstream required job already failed the run.
    if: always()
    steps:
      - name: Fail if any smoke leg failed
        if: contains(fromJSON('["failure", "cancelled"]'), needs.node-smoke.result)
        run: exit 1

  # The neutrality gate Bun's bundler cannot provide: esbuild with
  # `--platform=browser` hard-errors on any Node builtin import (Bun's
  # `--target browser` silently stubs them instead), the minified bundle is
  # grepped for runtime globals, and the result is executed.
  browser-smoke:
    name: Browser Smoke Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          # ! No package-lock.json in this repo — setup-node's npm auto-cache
          # ! (on by default since v5) hard-fails when it cannot find one.
          package-manager-cache: false

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Assert dist library files carry no host-runtime specifiers
        # The quote-prefixed pattern also catches side-effect and dynamic
        # imports of builtins, which a `from`-anchored grep would miss.
        run: |
          test -d dist
          if grep -rEl "'(node|bun):|require\(" dist --include='*.js' | grep -v '^dist/cli/'; then
            echo 'Found Node/Bun specifiers in library dist files (listed above).'
            exit 1
          fi

      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/tarball

      - name: Install tarball in scratch project
        run: |
          mkdir "$RUNNER_TEMP/browser-smoke"
          cd "$RUNNER_TEMP/browser-smoke"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/tarball/roll-parser-*.tgz

      - name: Write browser fixture importing both entry points
        working-directory: ${{ runner.temp }}/browser-smoke
        run: |
          printf '%s\n' \
            "import { roll, SeededRNG, VERSION } from 'roll-parser';" \
            "import { createMockRng } from 'roll-parser/testing';" \
            "const pinned = roll('4d6kh3', { rng: createMockRng([3, 6, 2, 5]) });" \
            "if (pinned.total !== 14) throw new Error('pinned total ' + pinned.total);" \
            "const seeded = roll('2d6', { rng: new SeededRNG('ci') });" \
            "console.log('browser-smoke OK', VERSION, pinned.total, seeded.total);" \
            > fixture.mjs

      - name: Bundle fixture for the browser
        run: ./node_modules/.bin/esbuild "$RUNNER_TEMP/browser-smoke/fixture.mjs" --bundle --platform=browser --format=esm --minify --outfile="$RUNNER_TEMP/browser-smoke/bundle.js"

      - name: Assert bundle is free of Node globals
        run: |
          test -f "$RUNNER_TEMP/browser-smoke/bundle.js"
          if grep -qE "node:|process\.|createRequire" "$RUNNER_TEMP/browser-smoke/bundle.js"; then
            echo 'Browser bundle references Node runtime internals.'
            exit 1
          fi

      - name: Execute browser bundle
        run: node "$RUNNER_TEMP/browser-smoke/bundle.js"
