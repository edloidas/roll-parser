# Manual-only: cross-library numbers against pinned competitor versions carry
# no regression signal for this repo, and shared runners are too noisy for
# µs-level assertions — so this never gates CI. Run it on demand and read the
# uploaded artifact.
name: Competitor benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: Matrix & bench
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bench/competitors/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install competitor packages
        working-directory: bench/competitors
        run: bun install --frozen-lockfile

      - name: Run matrix and bench
        working-directory: bench/competitors
        run: |
          bun run matrix.ts 2>&1 | tee competitor-report.txt
          bun run bench.ts 2>&1 | tee -a competitor-report.txt

      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: competitor-report
          path: |
            bench/competitors/competitor-report.txt
            bench/competitors/matrix-results.json
