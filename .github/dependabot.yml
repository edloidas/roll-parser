version: 2

updates:
  # Actions are SHA-pinned for supply-chain safety, which makes them invisible
  # to any "is there a newer vX" signal. Dependabot rewrites the SHA and the
  # trailing `# vX.Y.Z` comment together, so the pins stay current without
  # anyone re-resolving them by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - improvement
    # One PR per week covering every action, not one PR per action. Action bumps
    # are almost always "new runner Node version, same inputs", so they review
    # and merge as a single unit — and one grouped PR burns one CI run, not N.
    groups:
      github-actions:
        patterns:
          - '*'

  # Every npm dependency here is devDependencies-only — the package ships zero
  # runtime dependencies — so these updates affect the toolchain and the docs
  # workspace, never a consumer's tree. Without this block nothing watched the
  # lockfile, which is how a `brace-expansion` advisory reached the build
  # unnoticed.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    labels:
      - improvement
    groups:
      npm-development:
        patterns:
          - '*'
