version: 2

updates:
  # Actions are SHA-pinned for supply-chain safety, which makes them invisible
  # to any "is there a newer vX" signal. Dependabot rewrites the SHA and the
  # trailing `# vX.Y.Z` comment together, so the pins stay current without
  # anyone re-resolving them by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - improvement
    # One PR per week covering every action, not one PR per action. Action bumps
    # are almost always "new runner Node version, same inputs", so they review
    # and merge as a single unit — and one grouped PR burns one CI run, not N.
    groups:
      github-actions:
        patterns:
          - '*'

  # Every dependency here is devDependencies-only — the package ships zero
  # runtime dependencies — so these updates affect the toolchain and the docs
  # workspace, never a consumer's tree. Without this block nothing watched the
  # lockfile, which is how a `brace-expansion` advisory reached the build
  # unnoticed.
  #
  # ! Must be `bun`, not `npm`. The npm updater rewrites `package.json` and
  # ! leaves `bun.lock` untouched, so every PR it opened landed with a stale
  # ! lockfile and died on CI's `bun install --frozen-lockfile`.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    labels:
      - improvement
    # Mirrors `minimumReleaseAge` in bunfig.toml. Without it Dependabot can
    # propose a version Bun then refuses to resolve, which puts the PR back in
    # the stale-lockfile state this block exists to avoid.
    cooldown:
      default-days: 3
    groups:
      npm-development:
        patterns:
          - '*'
