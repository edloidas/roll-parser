[install]
# Never auto-install a missing package at runtime — a release build resolves
# from the lockfile or fails.
auto = "disable"
# Three days. Nothing is exempt: a fast-moving toolchain package is exactly the
# kind of dependency a compromised publish would target.
minimumReleaseAge = 259200

[test]
coverageSkipTestFiles = true

# Enforced only when coverage runs (`bun test --coverage`, `test:ci`) — plain
# `bun test` stays fast. This is the only place the numbers live; CONTRIBUTING.md
# quotes them but points here.
[test.coverageThreshold]
lines = 0.98
functions = 1.0
